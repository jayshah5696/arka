# WHAT:      Privacy-Aware Guardrails example.
# WHEN:      Use this to generate synthetic data with canary tracking and semantic similarity filtering.
# REQUIRES:  examples/seeds/08-privacy-seeds.jsonl
# RUN:       uv run arka --config examples/08-privacy-guardrails.yaml --run-id test-08
# ARTIFACTS: runs/<run-id>/... plus ./output/08-privacy-guardrails-dataset.jsonl.
# TEACHES:   Canary filtering and Semantic Similarity filtering.
# COST:      low
version: "1"

llm:
  provider: openai
  model: google/gemini-3.1-flash-lite-preview
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 30
  max_retries: 3
  openai_compatible:
    referer: https://example.com
    title: arka

executor:
  mode: threadpool
  max_workers: 1

pipeline:
  - type: seed_source
    path: ./seeds/08-privacy-seeds.jsonl

  - type: normalize_conversation

  - type: prompt_based_generator
    target_count: 5
    generation_multiplier: 1
    prompt_template: |
      Rewrite this instruction and response to be more concise.
      Return only JSON with keys "instruction" and "response".

      Seed instruction:
      {seed_instruction}

      Seed response:
      {seed_response}

  - type: semantic_similarity
    threshold: 0.95

  - type: canary
    phrases:
      - "SUPER_SECRET_PROJECT_X"

embeddings:
  provider: huggingface
  model: all-MiniLM-L6-v2

output:
  format: jsonl
  path: ./output/08-privacy-guardrails-dataset.jsonl
