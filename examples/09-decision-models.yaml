# WHAT:      Generate candidates and judge them with typed decision answers.
# WHEN:      Use this to try decision stages without an LLM judge fallback.
# REQUIRES:  OPENROUTER_API_KEY and OPENAI_API_KEY.
# RUN:       uv run arka --config examples/09-decision-models.yaml --run-id decisions
# ARTIFACTS: runs/<run-id>/... and ./output/09-decision-dataset.jsonl.
# TEACHES:   Seed gate, best-of-N, shared judge panel, and confidence weights.
# COST:      low
version: "1"

llm:
  provider: openai
  model: google/gemini-3.1-flash-lite-preview
  api_key: ${OPENROUTER_API_KEY}
  base_url: https://openrouter.ai/api/v1

decisions:
  provider: openai
  model: gpt-6-luna
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1
  timeout_seconds: 10
  max_retries: 4
  max_state_chars: 24000
  # Set input_cost_per_million to your current price to report measured cost.

executor:
  mode: threadpool
  max_workers: 4

pipeline:
  - type: seed_source
    path: ./seeds/07-humanizer-rewrite.jsonl
  - type: normalize_conversation
  - type: seed_gate
    accept_at: 0.8
    reject_at: 0.3
    on_uncertain: drop
  - type: prompt_based_generator
    target_count: 10
    generation_multiplier: 2
    best_of_n:
      enabled: true
      keep_per_seed: 1
      min_score: 2
  - type: exact
  - type: length
    min_response_chars: 20
  - type: decision_panel
    include: auto
  - type: labeling_engine
    backend: decision
    rubric_path: ../rubrics/sft_quality.yaml
    min_overall_score: 3.5
    on_uncertain: escalate
  - type: complexity_elo
    backend: decision
  - type: reward_model
    backend: decision
    min_score: 6
    on_uncertain: escalate
  - type: double_critic
    backend: decision
    accept_at: 0.75
    reject_at: 0.4
    on_uncertain: escalate
  - type: select
    target_count: 10
    weights:
      decisions.reward_model.helpfulness: 0.6
      decisions.complexity_elo.complexity: 0.4
    confidence_weighting: true
    tie_break: confidence

output:
  format: chatml
  path: ./output/09-decision-dataset.jsonl
  on_unresolved_escalation: drop
